<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Eren Arif Kargalıoğlu">
<style>
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.r{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
</style>
<defs>
<clipPath id="clip"><rect width="1280" height="380" rx="24"/></clipPath>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#f472b6"/>
<animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".42"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="7s" repeatCount="indefinite"/>
</pattern>
<radialGradient id="fadeg" cx=".5" cy=".5" r=".75"><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="1280" height="380" fill="url(#fadeg)"/></mask>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="380" fill="#07070c"/>
<rect width="1280" height="380" fill="url(#grid)" mask="url(#gm)"/>
<circle cx="180" cy="40" r="300" fill="url(#o1)"><animate attributeName="cx" values="140;300;140" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;120;40" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1120" cy="360" r="280" fill="url(#o2)"><animate attributeName="cx" values="1120;980;1120" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="400" r="220" fill="url(#o3)"><animate attributeName="cx" values="560;760;560" dur="18s" repeatCount="indefinite"/></circle>

<g>
<circle cx="1030" cy="190" r="96" fill="url(#o1)"><animate attributeName="r" values="80;112;80" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="1030" cy="190" r="70" fill="none" stroke="#fff" stroke-opacity=".10"/>
<circle cx="1030" cy="190" r="118" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 8"/>
<circle cx="1030" cy="190" r="165" fill="none" stroke="#fff" stroke-opacity=".08"/>
<g><circle cx="1030.0" cy="260.0" r="9.6" fill="#22d3ee" opacity=".16"/><circle cx="1030.0" cy="260.0" r="4" fill="#22d3ee"/>
<animateTransform attributeName="transform" type="rotate" from="0 1030 190" to="360 1030 190" dur="11s" repeatCount="indefinite"/></g>
<g><circle cx="1148.0" cy="190.0" r="12.0" fill="#7c5cff" opacity=".16"/><circle cx="1148.0" cy="190.0" r="5" fill="#7c5cff"/><circle cx="971.0" cy="292.2" r="12.0" fill="#f472b6" opacity=".16"/><circle cx="971.0" cy="292.2" r="5" fill="#f472b6"/><circle cx="971.0" cy="87.8" r="12.0" fill="#22d3ee" opacity=".16"/><circle cx="971.0" cy="87.8" r="5" fill="#22d3ee"/>
<animateTransform attributeName="transform" type="rotate" from="360 1030 190" to="0 1030 190" dur="22s" repeatCount="indefinite"/></g>
<g><circle cx="1156.4" cy="296.1" r="12.0" fill="#f472b6" opacity=".16"/><circle cx="1156.4" cy="296.1" r="5" fill="#f472b6"/><circle cx="875.0" cy="246.4" r="12.0" fill="#22d3ee" opacity=".16"/><circle cx="875.0" cy="246.4" r="5" fill="#22d3ee"/><circle cx="1044.4" cy="25.6" r="12.0" fill="#7c5cff" opacity=".16"/><circle cx="1044.4" cy="25.6" r="5" fill="#7c5cff"/>
<animateTransform attributeName="transform" type="rotate" from="0 1030 190" to="360 1030 190" dur="36s" repeatCount="indefinite"/></g>
<polygon points="1064.6,170.0 1064.6,210.0 1030.0,230.0 995.4,210.0 995.4,170.0 1030.0,150.0" fill="#0d0d14" stroke="url(#gs)" stroke-width="2"/>
<text x="1030" y="199" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="800" fill="url(#gs)">{ }</text>
</g>

<g class="r" style="animation-delay:.1s">
<text x="80" y="84" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="17" fill="#7a7a96"><tspan fill="#22d3ee">~/ankara</tspan> <tspan fill="#f472b6">❯</tspan> whoami</text>
</g>
<text class="r" style="animation-delay:.25s" x="76" y="184" font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="#f4f4fb">Eren Arif</text>
<text class="r" style="animation-delay:.45s" x="76" y="272" font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="url(#g)">Kargalıoğlu</text>
<g class="r" style="animation-delay:.7s">
<text x="80" y="326" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="19" fill="#7a7a96">full-stack developer  <tspan fill="#7c5cff">·</tspan>  founder @ <tspan fill="#f4f4fb">ERN Yazılım</tspan> <tspan fill="#22d3ee">█<animate attributeName="fill-opacity" values="1;0;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
</g>

<g class="r" style="animation-delay:.9s">
<circle cx="1090" cy="50" r="10" fill="#34d399" opacity=".2"><animate attributeName="r" values="5;12;5" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="1090" cy="50" r="4" fill="#34d399"/>
<text x="1236" y="55" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#7a7a96">ankara · utc+3</text>
</g>
<rect y="378" width="1280" height="2" fill="url(#g)"/>
</g>
<rect x=".5" y=".5" width="1279" height="379" rx="24" fill="none" stroke="#1c1c2b"/>
